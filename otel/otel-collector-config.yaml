receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  influxdb:
    endpoint: ${env:INFLUXDB_URL}
    org: ${env:INFLUXDB_ORG}
    bucket: ${env:INFLUXDB_BUCKET}
    token: ${env:INFLUXDB_TOKEN}
    metrics_schema: telegraf-prometheus-v1
  otlp/tempo:
    endpoint: grafana-tempo:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [influxdb, debug]
