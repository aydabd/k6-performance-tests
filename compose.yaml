services:
  influxdb:
    image: influxdb:2.7.12
    networks:
      - k6-webnet
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME:?INFLUXDB_USERNAME is required}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:?INFLUXDB_PASSWORD is required}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:?INFLUXDB_ORG is required}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:?INFLUXDB_BUCKET is required}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN is required}
    volumes:
      - k6-influxdb-data:/var/lib/influxdb2
      - k6-influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8086/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana-enterprise:13.2.2
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - k6-webnet
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN is required}
      - INFLUXDB_ORG=${INFLUXDB_ORG:?INFLUXDB_ORG is required}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:?INFLUXDB_BUCKET is required}
    volumes:
      - k6-grafana-data:/var/lib/grafana
      - ./grafana:/etc/grafana/provisioning/
      - ./grafana/config/grafana.ini:/etc/grafana/grafana.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    restart: always
    image: nginx:1.29.1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      influxdb:
        condition: service_healthy
      grafana:
        condition: service_healthy
    networks:
      - k6-webnet

  k6-template-influxdb-base:
    build:
      context: .
      dockerfile: Dockerfile
    image: k6-template-influxdb-base:2.2.0
    volumes:
      - /usr/share/zoneinfo/UTC:/etc/localtime:ro
    networks:
      - k6-webnet

  simple-k6-test-template:
    depends_on:
      otel-collector-ready:
        condition: service_healthy
    build:
      context: .
      dockerfile: simple-k6-test-template/Dockerfile
    image: simple-k6-test-template:2.2.0
    environment:
      - TEST_RUN_ID=${TEST_RUN_ID:-default}
      - K6_TAGS=testRunId:${TEST_RUN_ID:-default}
      - K6_OTEL_EXPORTER_PROTOCOL=${K6_OTEL_EXPORTER_PROTOCOL:-grpc}
      - K6_OTEL_GRPC_EXPORTER_ENDPOINT=${K6_OTEL_GRPC_EXPORTER_ENDPOINT:-otel-collector:4317}
      - K6_OTEL_GRPC_EXPORTER_INSECURE=${K6_OTEL_GRPC_EXPORTER_INSECURE:-true}
    volumes:
      - ./simple-k6-test-template/test-logs:/performance-k6/test-logs
    networks:
      - k6-webnet

  agents-pipeline-test:
    depends_on:
      otel-collector-ready:
        condition: service_healthy
    build:
      context: .
      dockerfile: agents-pipeline-test/Dockerfile
    image: agents-pipeline-test:2.2.0
    environment:
      - TEST_RUN_ID=${TEST_RUN_ID:-default}
      - K6_TAGS=testRunId:${TEST_RUN_ID:-default}
      - K6_OTEL_EXPORTER_PROTOCOL=${K6_OTEL_EXPORTER_PROTOCOL:-grpc}
      - K6_OTEL_GRPC_EXPORTER_ENDPOINT=${K6_OTEL_GRPC_EXPORTER_ENDPOINT:-otel-collector:4317}
      - K6_OTEL_GRPC_EXPORTER_INSECURE=${K6_OTEL_GRPC_EXPORTER_INSECURE:-true}
    volumes:
      - ./agents-pipeline-test/test-logs:/performance-k6/test-logs
    networks:
      - k6-webnet

  websocket-echo:
    image: jmalloc/echo-server:0.3.6
    ports:
      - "9001:8080"
    networks:
      - k6-webnet
    restart: unless-stopped

  simple-k6-websocket-test:
    image: simple-k6-websocket-test:2.2.0
    build:
      context: .
      dockerfile: simple-k6-websocket-test/Dockerfile
    depends_on:
      otel-collector-ready:
        condition: service_healthy
      websocket-echo:
        condition: service_started
    environment:
      - API_SERVER=websocket-echo
      - TEST_RUN_ID=${TEST_RUN_ID:-default}
      - K6_TAGS=testRunId:${TEST_RUN_ID:-default}
      - K6_OTEL_EXPORTER_PROTOCOL=${K6_OTEL_EXPORTER_PROTOCOL:-grpc}
      - K6_OTEL_GRPC_EXPORTER_ENDPOINT=${K6_OTEL_GRPC_EXPORTER_ENDPOINT:-otel-collector:4317}
      - K6_OTEL_GRPC_EXPORTER_INSECURE=${K6_OTEL_GRPC_EXPORTER_INSECURE:-true}
    volumes:
      - ./simple-k6-websocket-test/test-logs:/performance-k6/test-logs
    networks:
      - k6-webnet

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    networks:
      - k6-webnet
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_ORG=${INFLUXDB_ORG:?INFLUXDB_ORG is required}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:?INFLUXDB_BUCKET is required}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN is required}
    depends_on:
      influxdb:
        condition: service_healthy
      grafana-tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector-ready:
    image: curlimages/curl:8.16.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until curl --fail --silent http://otel-collector:13133/; do sleep 1; done;
        tail -f /dev/null
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - k6-webnet
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://otel-collector:13133/"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana-tempo:
    image: grafana/tempo:3.0.3
    networks:
      - k6-webnet
    ports:
      - "3200:3200"
    volumes:
      - ./grafana/tempo/tempo-config.yaml:/etc/tempo/config.yaml:ro
    command: ["-config.file=/etc/tempo/config.yaml"]
    healthcheck:
      test: ["CMD", "/tempo", "--health", "--health.url=http://localhost:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  business-flow-template:
    profiles:
      - business-flows
      - flow-default
    build:
      context: .
      dockerfile: business-flow-template/Dockerfile
    image: business-flow-template:2.2.0
    depends_on:
      otel-collector-ready:
        condition: service_healthy
    environment:
      - BUSINESS_FLOW_NAME=${BUSINESS_FLOW_NAME:-default-flow}
      - TEST_RUN_ID=${TEST_RUN_ID:-default}
      - K6_TAGS=testRunId:${TEST_RUN_ID:-default}
    volumes:
      - ./business-flow-template/test-logs:/performance-k6/test-logs
    networks:
      - k6-webnet

volumes:
  k6-influxdb-data: {}
  k6-influxdb-config: {}
  k6-grafana-data: {}

networks:
  k6-webnet:
