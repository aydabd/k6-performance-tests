# Combines deployment and service for influxdb
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: k6-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
        - name: influxdb
          image: influxdb:2.7.12
          env:
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: "setup"
            - name: DOCKER_INFLUXDB_INIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: k6-influxdb-credentials
                  key: username
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k6-influxdb-credentials
                  key: password
            - name: DOCKER_INFLUXDB_INIT_ORG
              valueFrom:
                secretKeyRef:
                  name: k6-influxdb-credentials
                  key: org
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              valueFrom:
                secretKeyRef:
                  name: k6-influxdb-credentials
                  key: bucket
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k6-influxdb-credentials
                  key: token
          ports:
            - containerPort: 8086
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: influxdb-data
              mountPath: /var/lib/influxdb2
      volumes:
        - name: influxdb-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: k6-tests
spec:
  selector:
    app: influxdb
  ports:
    - port: 8086
      targetPort: 8086
